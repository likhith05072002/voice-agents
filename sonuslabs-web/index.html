<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SonusLabs — The voice of your business</title>
  <!-- SVG first (crisp at any size, dark-mode friendly); .ico is the fallback
       for browsers that ignore SVG icons. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#211C15" />
  <meta name="description" content="An AI receptionist that answers your business calls 24/7 in English, Hindi, Kannada, Telugu, Tamil and more — switching language the moment your caller does. From ₹3.5/min." />
  <meta property="og:title" content="SonusLabs — The voice of your business" />
  <meta property="og:description" content="An AI receptionist that answers your business calls 24/7 in 11 Indian languages, in your own voice." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sonuslabs.online" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Noto+Serif+Devanagari:wght@500;600;700&family=Noto+Sans+Kannada:wght@500;600;700&family=Noto+Sans+Telugu:wght@500;600&family=Noto+Sans+Tamil:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:#FAF7F0}
    body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:#211C15;-webkit-font-smoothing:antialiased}
    ::selection{background:#F6D79E}
    input,textarea,select,button{font-family:inherit}
    @keyframes sl-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
    @keyframes sl-fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes sl-blink{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes sl-spin{to{transform:rotate(360deg)}}
    @keyframes sl-eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    @keyframes sl-livedot{0%,100%{opacity:1}50%{opacity:.3}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
